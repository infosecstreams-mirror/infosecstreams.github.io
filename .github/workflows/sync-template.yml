name: Sync from Template

on:
  # Run automatically once a week (e.g., every Monday at midnight)
  schedule:
    - cron: "0 0 * * 1"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  template_sync:
    runs-on: ubuntu-latest
    
    # Do not run this workflow on the template repository itself, only on downstream mirrors!
    if: github.repository != 'infosecstreams-mirror/infosecstreams.github.io'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Template Repository
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: infosecstreams-mirror/infosecstreams.github.io
          upstream_branch: main
          pr_title: "🚀 [Automated] Sync updates from upstream template"
          pr_commit_msg: "chore(sync): pull latest updates from template"
          pr_body: "This PR automatically syncs the latest layout and structural changes from the central InfoSec Streams template repository."
